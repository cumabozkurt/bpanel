# Managed by BOZKURT PANEL (web extras) — changes are overwritten.
Alias /.bpanel-errors/ "/var/lib/bpanel/webx/example.test/errors/"
<Directory "/var/lib/bpanel/webx/example.test/errors">
    Options None
    AllowOverride None
    Require all granted
</Directory>
ErrorDocument 404 /.bpanel-errors/404.html
ErrorDocument 503 /.bpanel-errors/503.html
AddType image/png .png
AddType application/manifest+json .webmanifest
<Directory "/home/u/public_html">
    <RequireAll>
        Require all granted
        Require not ip 192.0.2.7
        Require not ip 2001:db8::/32
        Require not ip 198.51.100.0/24
    </RequireAll>
</Directory>
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP_REFERER} !^$
    RewriteCond %{HTTP_REFERER} !^https?://([^/]+\.)?example\.test(:[0-9]+)?(/|$) [NC]
    RewriteCond %{HTTP_REFERER} !^https?://([^/]+\.)?www\.example\.test(:[0-9]+)?(/|$) [NC]
    RewriteCond %{HTTP_REFERER} !^https?://([^/]+\.)?partner\.test(:[0-9]+)?(/|$) [NC]
    RewriteRule \.(jpg|png)$ - [F,NC]
</IfModule>
<Directory "/home/u/public_html/admin">
    AuthType Basic
    AuthName "Staff only"
    AuthUserFile "/var/lib/bpanel/webx/example.test/htpasswd/0"
    Require valid-user
</Directory>
