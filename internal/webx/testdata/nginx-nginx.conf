# Managed by BOZKURT PANEL (web extras) — changes are overwritten.
# IP blocker
deny 192.0.2.7;
deny 2001:db8::/32;
deny 198.51.100.0/24;
# custom error pages (served from outside the docroot)
error_page 404 /.bpanel-errors/404.html;
error_page 503 /.bpanel-errors/503.html;
location ^~ /.bpanel-errors/ { internal; alias "/var/lib/bpanel/webx/example.test/errors/"; }
# extra MIME types
location ~* \.png$ {
    types { }
    default_type "image/png";
    valid_referers none blocked server_names example.test *.example.test partner.test *.partner.test;
    if ($invalid_referer) { return 403; }
    try_files $uri =404;
}
location ~* \.webmanifest$ {
    types { }
    default_type "application/manifest+json";
    try_files $uri =404;
}
# hotlink protection
location ~* \.(?:jpg|png)$ {
    valid_referers none blocked server_names example.test *.example.test partner.test *.partner.test;
    if ($invalid_referer) { return 403; }
    expires 7d;
    try_files $uri =404;
}
# directory privacy
location ^~ "/admin/" {
    auth_basic "Staff only";
    auth_basic_user_file "/var/lib/bpanel/webx/example.test/htpasswd/0";
    location ~ /\.(ht|git|svn|env) { deny all; }
    try_files $uri $uri/ =404;
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass "unix:/run/php/php8.3-fpm-u.sock";
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 300;
    }
}
