# Managed by BOZKURT PANEL (web extras) — changes are overwritten.
# IP blocker
deny 192.0.2.7;
deny 2001:db8::/32;
deny 198.51.100.0/24;
# custom error pages (served from outside the docroot)
error_page 404 /.bpanel-errors/404.html;
error_page 503 /.bpanel-errors/503.html;
location ^~ /.bpanel-errors/ { internal; alias "/var/lib/bpanel/webx/example.test/errors/"; }
# extra MIME types
location ~* \.png$ {
    types { }
    default_type "image/png";
    valid_referers none blocked server_names *.example.test partner.test *.partner.test;
    if ($invalid_referer) { return 403; }
    try_files $uri @apache;
}
location ~* \.webmanifest$ {
    types { }
    default_type "application/manifest+json";
    try_files $uri @apache;
}
# hotlink protection
location ~* \.(?:jpg|png)$ {
    valid_referers none blocked server_names *.example.test partner.test *.partner.test;
    if ($invalid_referer) { return 403; }
    expires 7d;
    try_files $uri @apache;
}
# directory privacy
location ^~ "/admin/" {
    auth_basic "Staff only";
    auth_basic_user_file "/var/lib/bpanel/webx/example.test/htpasswd/0";
    location ~ /\.(ht|git|svn|env) { deny all; }
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
}
